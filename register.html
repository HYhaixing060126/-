<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活力空间 · 注册</title><link rel="stylesheet" href="login.css"><style>.register-card{width:min(440px,calc(100% - 32px))}.register-card h1{margin-bottom:8px}.register-card form{margin-top:22px}.register-card button{margin-top:8px}.register-message{min-height:24px;margin-top:14px;text-align:center;color:#596eff}.back-link{display:block;text-align:center;margin-top:18px;color:#596eff;text-decoration:none}</style></head>
<body><div class="login-card register-card"><div class="logo">✦ <b>活力空间</b><small>GYM MANAGEMENT</small></div><h1>注册会员</h1><p>注册即到账 50 元，可用于升级 VIP</p><form id="registerForm"><label>账号<input name="username" minlength="3" required placeholder="至少 3 位字符"></label><label>密码<input name="password" type="password" minlength="6" required placeholder="至少 6 位字符"></label><label>姓名<input name="realName" required placeholder="请输入真实姓名"></label><label>手机号<input name="phone" required placeholder="请输入手机号"></label><button>注册账号</button><div id="registerMessage" class="register-message"></div></form><a class="back-link" href="login.html">已有账号？返回登录</a></div><script src="register.js"></script></body></html>
